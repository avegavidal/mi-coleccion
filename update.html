<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Actualizar Mi Colección</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Manrope, system-ui, sans-serif;
      background: #0c1218;
      color: #e8eef2;
      padding: 24px;
      text-align: center;
    }
    p { line-height: 1.45; opacity: 0.9; }
  </style>
</head>
<body>
  <div>
    <p id="msg">Borrando caché y cargando la última versión…</p>
  </div>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      function set(t) { if (msg) msg.textContent = t; }

      function goHome(bust) {
        var dest = new URL('index.html', location.href);
        dest.search = '';
        dest.searchParams.set('_b', String(bust || Date.now()));
        dest.searchParams.set('_from', 'update');
        dest.hash = '#/dashboard';
        location.replace(dest.href);
      }

      async function wipe() {
        set('Quitando service workers…');
        try {
          localStorage.clear();
        } catch (e) {}
        try {
          sessionStorage.clear();
        } catch (e) {}
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
        } catch (e) {}
        set('Vaciando Cache API…');
        try {
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        var bust = Date.now();
        set('Descargando archivos nuevos…');
        var files = [
          'index.html?_=' + bust,
          'version.json?_=' + bust,
          'js/config.js?v=' + bust,
          'js/app.js?v=' + bust,
          'css/styles.css?v=' + bust,
          'service-worker.js?v=' + bust
        ];
        await Promise.all(files.map(function (p) {
          return fetch(new URL(p, location.href), { cache: 'reload', credentials: 'same-origin' }).catch(function () { return null; });
        }));
        try { sessionStorage.setItem('mi_coleccion_update_pass', 'done'); } catch (e) {}
        set('Listo. Entrando…');
        goHome(bust);
      }

      wipe().catch(function () {
        set('No se pudo limpiar del todo. Reintentando…');
        setTimeout(function () { goHome(Date.now()); }, 600);
      });
    })();
  </script>
</body>
</html>
