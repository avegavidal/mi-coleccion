<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#e8f0f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mi Colección" />
  <meta name="description" content="Administra tu colección de figuras e identifica piezas por similitud visual." />
  <link rel="manifest" href="./manifest.json?v=60" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png" />
  <meta name="mi-coleccion-build" content="1.6.20" />
  <script>
    // Fuerza salida del SW/cache viejo (iPhone PWA a menudo sigue con modules 1.5.x)
    (function () {
      var BUILD = '1.6.20';
      var KEY = 'mi_coleccion_build_v';
      try {
        if (localStorage.getItem(KEY) === BUILD) return;
        localStorage.setItem(KEY, BUILD);
        var done = Promise.resolve();
        if ('serviceWorker' in navigator) {
          done = navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        }
        done.then(function () {
          if (!window.caches) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).then(function () {
          var url = new URL(location.href);
          url.searchParams.set('_b', BUILD.replace(/\W/g, ''));
          location.replace(url.toString());
        }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      try {
        var k = 'mi_coleccion_theme_v1';
        var pref = localStorage.getItem(k) || 'system';
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = pref === 'dark' || (pref !== 'light' && dark) ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePref = pref === 'light' || pref === 'dark' ? pref : 'system';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0c1218' : '#e8f0f2');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css?v=60" />
  <title>Mi Colección</title>
</head>

    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Principal">
