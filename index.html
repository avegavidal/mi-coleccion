<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#e8f0f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mi Colección" />
  <meta name="description" content="Administra tu colección de figuras e identifica piezas por similitud visual." />
  <link rel="manifest" href="./manifest.json?v=66" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png" />
  <meta name="mi-coleccion-build" content="1.6.26" />
  <script>
    (function () {
      try {
        var k = 'mi_coleccion_theme_v1';
        var pref = localStorage.getItem(k) || 'system';
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = pref === 'dark' || (pref !== 'light' && dark) ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePref = pref === 'light' || pref === 'dark' ? pref : 'system';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0c1218' : '#e8f0f2');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css?v=66" />
  <title>Mi Colección</title>
  <style>
    #force-update-bar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 9999;
      padding: 10px 12px;
      background: #b45309;
      color: #fff;
      font-family: Manrope, system-ui, sans-serif;
      font-size: 0.92rem;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    #force-update-bar.show { display: flex; }
    #force-update-bar button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      background: #fff;
      color: #9a3412;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="force-update-bar" role="status">
    <span id="force-update-msg">Hay una versión nueva. Actualiza para corregir errores.</span>
    <button type="button" id="btn-force-update-html">Actualizar ahora</button>
  </div>

  <div id="offline-banner" class="offline-banner hidden">Sin conexión. Puedes ver la interfaz; identificación y subidas requieren Internet.</div>
  <div id="config-warning" class="config-warning hidden">
    Configura <code>js/config.js</code> con tu URL y anon key de Supabase. Ver README.
  </div>

  <div id="app">
    <header id="top-bar" class="top-bar hidden">
      <a href="#/dashboard" class="brand">Mi Colección</a>
      <div class="top-actions">
        <button type="button" id="btn-force-update-top" class="icon-btn" aria-label="Actualizar app" title="Actualizar app">↻</button>
        <a href="#/collections" class="icon-btn" aria-label="Categorías" title="Categorías">▣</a>
        <a href="#/settings" class="icon-btn" aria-label="Configuración">⚙</a>
        <a href="#/account" class="icon-btn" aria-label="Cuenta">👤</a>
        <button type="button" id="btn-logout-top" class="icon-btn" aria-label="Cerrar sesión">⎋</button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Principal">
      <a href="#/dashboard" data-route="dashboard" aria-label="Inicio"><span aria-hidden="true">⌂</span><small>Inicio</small></a>
      <a href="#/collection" data-route="collection" aria-label="Colección"><span aria-hidden="true">◈</span><small>Colección</small></a>
      <a href="#/identify" data-route="identify" class="nav-identify" aria-label="Identificar figura"><span aria-hidden="true">📷</span><small>Identificar</small></a>
      <a href="#/wishlist" data-route="wishlist" aria-label="Wishlist"><span aria-hidden="true">☆</span><small>Wishlist</small></a>
      <a href="#/stats" data-route="stats" aria-label="Estadísticas"><span aria-hidden="true">▦</span><small>Stats</small></a>
    </nav>
  </div>

  <div id="toast-host" class="toast-host"></div>

  <script src="./js/config.js?v=66"></script>
  <script>
    (function () {
      var EXPECTED = '1.6.26';
      function clearAndReload() {
        try {
          localStorage.removeItem('mi_coleccion_build_v');
          localStorage.removeItem('mi_coleccion_sw_reloaded');
        } catch (e) {}
        var chain = Promise.resolve();
        if ('serviceWorker' in navigator) {
          chain = navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        }
        return chain.then(function () {
          if (!window.caches) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        }).then(function () {
          var url = new URL(location.href);
          url.searchParams.set('_b', String(Date.now()));
          location.replace(url.toString());
        }).catch(function () {
          location.reload();
        });
      }

      window.__forceAppUpdate = clearAndReload;

      var bar = document.getElementById('force-update-bar');
      var msg = document.getElementById('force-update-msg');
      var btn = document.getElementById('btn-force-update-html');
      var topBtn = document.getElementById('btn-force-update-top');
      if (btn) btn.addEventListener('click', clearAndReload);
      if (topBtn) topBtn.addEventListener('click', clearAndReload);

      var actual = (window.APP_CONFIG && window.APP_CONFIG.APP_VERSION) || '';
      if (actual !== EXPECTED) {
        if (msg) msg.textContent = 'Versión ' + (actual || '?') + ' — necesitas ' + EXPECTED;
        if (bar) bar.classList.add('show');
        // Auto-intento una sola vez si el config quedó viejo en caché
        try {
          if (sessionStorage.getItem('mi_coleccion_force_reload') !== EXPECTED) {
            sessionStorage.setItem('mi_coleccion_force_reload', EXPECTED);
            clearAndReload();
          }
        } catch (e) {}
      } else {
        try { localStorage.setItem('mi_coleccion_build_v', EXPECTED); } catch (e) {}
      }
    })();
  </script>
  <script type="module" src="./js/app.js?v=66"></script>
</body>
</html>
